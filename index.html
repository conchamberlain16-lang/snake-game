<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Neon Serpent is a retro arcade snake game that runs in the browser with no build step and no external dependencies.">
<title>Neon Serpent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c121b'/%3E%3Cpath d='M6 16h8a4 4 0 0 0 4-4v-2a4 4 0 0 1 4-4h3' fill='none' stroke='%232bf0c8' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='26' cy='9' r='3' fill='%23ffc24b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <h1 class="brand__title">Neon Serpent</h1>
    </div>

    <div class="hud">
      <div class="stat">
        <span class="stat__label">Score</span>
        <span class="stat__value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat__label">Best</span>
        <span class="stat__value" id="best">0</span>
      </div>
      <p class="status" id="status" data-state="ready" role="status" aria-live="polite">
        <span class="status__dot" aria-hidden="true"></span>
        <span id="statusText">Ready</span>
      </p>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="board" class="board" width="600" height="600" role="img" aria-label="Game board: a grid where you steer the snake into food"></canvas>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay__panel">
        <p class="overlay__kicker" id="overlayKicker">Ready</p>
        <p class="overlay__score" id="overlayScore"><span id="scoreLabel">Score</span> <strong id="finalScore">0</strong></p>
        <p class="overlay__note" id="overlayNote" hidden>New best</p>
        <button class="btn" id="actionBtn" type="button">Start game</button>
        <p class="overlay__hint" id="overlayHint">Arrow keys, WASD, or swipe to steer</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <ul class="keys" aria-label="Keyboard controls">
      <li><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd><span>or</span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>steer</span></li>
      <li><kbd>Space</kbd><span>or</span><kbd>P</kbd><span>pause</span></li>
      <li><kbd>R</kbd><span>restart</span></li>
    </ul>

    <div class="dpad" id="dpad" role="group" aria-label="Touch controls">
      <button class="dpad__btn dpad__btn--up" type="button" data-dir="up" aria-label="Move up">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
      <button class="dpad__btn dpad__btn--left" type="button" data-dir="left" aria-label="Move left">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg>
      </button>
      <button class="dpad__btn dpad__btn--down" type="button" data-dir="down" aria-label="Move down">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12l7 7 7-7"/></svg>
      </button>
      <button class="dpad__btn dpad__btn--right" type="button" data-dir="right" aria-label="Move right">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <noscript>
    <p class="noscript">Neon Serpent needs JavaScript enabled to run.</p>
  </noscript>
</main>

<script src="game.js"></script>
</body>
</html>
